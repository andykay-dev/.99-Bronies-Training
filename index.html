<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Bronies .99 Training — embrace the .99 chaos" />
    <title>Bronies .99 Training</title>

    <!-- Favicon for browser tabs (SVG works fine here) -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/apple-touch-icon.png" />

    <!--
      iOS "Add to Home Screen" — MUST be PNG, not SVG.
      Safari only reads apple-touch-icon as a raster image.
      180×180 is the canonical size for all modern iPhones.
      No "precomposed" suffix = iOS adds its own gloss/rounding.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- iOS PWA display settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bronies" />

    <!-- Splash screen background colour while the app loads on iOS -->
    <meta name="theme-color" content="#0D1117" />

    <!-- Android / Chrome PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
