<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background — Bronies navy with subtle radial depth -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#2E5FA3"/>
      <stop offset="100%" stop-color="#1A3060"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F5C800"/>
      <stop offset="100%" stop-color="#C49A00"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Top ribbon: BRONIES wordmark -->
  <text x="256" y="118" text-anchor="middle"
        font-family="'Georgia', 'Times New Roman', serif"
        font-weight="700" font-size="52" letter-spacing="6"
        fill="#FFFFFF" opacity="0.95">BRONIES</text>

  <!-- Underline accent -->
  <rect x="186" y="138" width="140" height="3" fill="url(#gold)" opacity="0.7"/>

  <!-- Main mark: large ".99" in gold -->
  <text x="256" y="340" text-anchor="middle"
        font-family="'Georgia', 'Times New Roman', serif"
        font-weight="900" font-size="220" letter-spacing="-2"
        fill="url(#gold)">.99</text>

  <!-- Bottom tagline -->
  <text x="256" y="420" text-anchor="middle"
        font-family="'Helvetica', 'Arial', sans-serif"
        font-weight="600" font-size="22" letter-spacing="4"
        fill="#FFFFFF" opacity="0.7">TRAINING</text>

  <!-- Subtle decorative lines flanking the tagline -->
  <line x1="120" y1="414" x2="170" y2="414" stroke="#F5C800" stroke-width="1.5" opacity="0.5"/>
  <line x1="342" y1="414" x2="392" y2="414" stroke="#F5C800" stroke-width="1.5" opacity="0.5"/>

  <!-- Bottom flourish — the .99 dot embedded as a small finishing accent -->
  <circle cx="256" cy="460" r="4" fill="#F5C800" opacity="0.8"/>
</svg>
